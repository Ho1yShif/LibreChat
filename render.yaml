services:
  - type: web
    name: librechat
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    dockerCommand: sh /app/scripts/render-start.sh
    disk:
      name: librechat-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: MONGO_HOSTPORT
        fromService:
          name: librechat-mongo
          type: pserv
          property: hostport
      - key: LIBRECHAT_TEMP_CREDENTIALS_PATH
        value: /app/data/.env.temp
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false

  - type: pserv
    name: librechat-mongo
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/library/mongo:8.0.20
    disk:
      name: mongo-data
      mountPath: /data/db
      sizeGB: 1
