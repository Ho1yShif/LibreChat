services:
  - type: web
    name: librechat
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    dockerCommand: >-
      sh -c "mkdir -p /app/data/uploads /app/data/images &&
      rm -rf /app/uploads /app/client/public/images &&
      ln -s /app/data/uploads /app/uploads &&
      ln -s /app/data/images /app/client/public/images &&
      npm run backend"
    disk:
      name: librechat-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: MONGO_URI
        value: mongodb://librechat-mongo:27017/LibreChat
      - key: LIBRECHAT_TEMP_CREDENTIALS_PATH
        value: /app/data/.env.temp
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false

  - type: pserv
    name: librechat-mongo
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/library/mongo:8.0.20
    disk:
      name: mongo-data
      mountPath: /data/db
      sizeGB: 1
